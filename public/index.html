<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gov Asset Lifecycle Portal</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <h1>GovAsset</h1>
          <p>Lifecycle Management</p>
        </div>
        <nav>
          <button class="nav-btn active" data-view="dashboard">Dashboard</button>
          <button class="nav-btn" data-view="assets">Assets</button>
          <button class="nav-btn" data-view="inspections">Inspections</button>
          <button class="nav-btn" data-view="history">History</button>
          <button class="nav-btn" id="logoutBtn">Logout</button>
        </nav>
      </aside>

      <main class="main-content">
        <section id="loginView" class="panel auth-panel">
          <div class="auth-card">
            <h2>Government Asset Portal</h2>
            <p>Sign in to manage physical asset lifecycle records</p>
            <form id="loginForm">
              <label>
                Email
                <input type="email" id="email" value="admin@gov.in" required />
              </label>
              <label>
                Password
                <input type="password" id="password" value="Admin@123" required />
              </label>
              <button type="submit">Login</button>
            </form>
            <div id="loginError" class="error-message"></div>
          </div>
        </section>

        <section id="appView" class="hidden">
          <header class="topbar">
            <div>
              <h2 id="welcomeTitle">Dashboard</h2>
            </div>
            <div class="user-pill" id="userInfo">Guest</div>
          </header>

          <div id="dashboardView" class="view-section">
            <div class="stats-grid">
              <div class="stat-card">
                <span>Total Assets</span>
                <strong id="totalAssets">0</strong>
              </div>
              <div class="stat-card">
                <span>Active Admins</span>
                <strong id="adminCount">0</strong>
              </div>
              <div class="stat-card">
                <span>Inspectors</span>
                <strong id="inspectorCount">0</strong>
              </div>
              <div class="stat-card">
                <span>Maintenance Tasks</span>
                <strong id="maintenanceCount">0</strong>
              </div>
            </div>
          </div>

          <div id="assetsView" class="view-section hidden">
            <div class="section-header">
              <h3>Assets</h3>
              <button id="createAssetBtn" class="primary-btn">New Asset</button>
            </div>
            <div id="assetList" class="card-list"></div>
          </div>

          <div id="inspectionsView" class="view-section hidden">
            <div class="section-header">
              <h3>Inspections</h3>
            </div>
            <div id="inspectionList" class="card-list"></div>
          </div>

          <div id="historyView" class="view-section hidden">
            <div class="section-header">
              <h3>History</h3>
            </div>
            <div id="historyList" class="card-list"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="assetModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Asset Action</h3>
          <button type="button" id="closeModalBtn" class="close-btn">×</button>
        </div>
        <form id="assetForm"></form>
      </div>
    </div>

    <div id="detailPanel" class="detail-panel hidden"></div>

    <script src="/app.js"></script>
  </body>
</html>
